# Builds POS.exe on Windows and publishes it as a GitHub Release.
#
# Trigger: any push to master. The version comes from CURRENT_VERSION in
# utils/update_checker.py. If a release for that version doesn't exist yet,
# the exe is built and a release + tag (e.g. V1.6.0) is created automatically.
# So to release: bump CURRENT_VERSION, commit, push. Nothing else.
# (Pushing a tag manually also works; "Run workflow" button too.)
name: Build & Release POS.exe

on:
  push:
    branches: [master]
    tags: ["V*", "v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'CURRENT_VERSION\s*=\s*"\K[^"]+' utils/update_checker.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release $VERSION already exists — skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Will build and release $VERSION."
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.1 matplotlib==3.11.1 Jinja2==3.1.6 requests==2.34.2 pyinstaller==6.22.1

      - name: Build POS.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name POS
          --collect-all PySide6 --collect-all matplotlib
          --add-data "ui/order/receipt.html;ui/order"
          --add-data "resources;resources"
          --add-data "fonts;fonts"
          --add-data "logo.ico;."
          --add-data "logo.png;."
          --icon "logo.ico" main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS-${{ needs.check.outputs.version }}
          path: dist/POS.exe

      - name: Publish GitHub Release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: POS ${{ needs.check.outputs.version }}
          files: dist/POS.exe
          body_path: CHANGES.md
